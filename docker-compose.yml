version: "3.9"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: portedge-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped
    networks:
      - portedge-net

  edge-gateway:
    build:
      context: ./services/edge-gateway
      dockerfile: Dockerfile
    container_name: portedge-gateway
    ports:
      - "8000:8000"
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - LOG_LEVEL=INFO
    depends_on:
      - mosquitto
    restart: unless-stopped
    networks:
      - portedge-net

  sensor-simulator:
    build:
      context: ./services/sensor-simulator
      dockerfile: Dockerfile
    container_name: portedge-sensors
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - PUBLISH_INTERVAL=2.0
    depends_on:
      - mosquitto
      - edge-gateway
    restart: unless-stopped
    networks:
      - portedge-net

  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
    container_name: portedge-dashboard
    ports:
      - "8501:8501"
    environment:
      - GATEWAY_URL=http://edge-gateway:8000
    depends_on:
      - edge-gateway
    restart: unless-stopped
    networks:
      - portedge-net

networks:
  portedge-net:
    driver: bridge
